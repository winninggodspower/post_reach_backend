name: CI - Run Tests

on:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure environment variables from env.sample
        run: |
          cp env.sample .env
          # Fernet key must be a valid 32 url-safe base64-encoded bytes string
          sed -i 's/replace-with-fernet-secret-key/djdYSI1V2gxi2k7XWVbfS9Q0puPxGWJndhIoF1cBtzE=/g' .env

      - name: Run tests
        env:
          SECRET_KEY: "test-secret-key-not-for-production"
          DEBUG: "False"
          DATABASE_URL: "sqlite:///db.sqlite3"
        run: |
          uv run pytest -v
